<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: stun: turn:"
    />
    <title>MathNotes</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --page: #000000;
        --rail: #131316;
        --line: #26262b;
        --ink: #e8e8ea;
        --dim: #8a8a93;
        --accent: #4c8dff;
        --flyout: #1c1c21;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      #app {
        display: flex;
        height: 100%;
      }

      /* --- Wąski toolbar po lewej. Żadnych pasków u góry. ------------------ */

      #toolbar {
        flex: 0 0 52px;
        background: var(--rail);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0;
        z-index: 3;
      }

      .tool {
        width: 38px;
        height: 38px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: var(--dim);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        touch-action: none;
      }

      .tool:hover {
        color: var(--ink);
        background: #ffffff0d;
      }

      .tool[aria-pressed="true"] {
        color: var(--ink);
        background: #ffffff14;
        border-color: #ffffff1f;
      }

      .tool:disabled {
        opacity: 0.3;
        cursor: default;
      }

      .tool svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .rail-gap {
        height: 10px;
      }

      /* Kropka na narzędziu pokazuje jego bieżący kolor, bez otwierania flyoutu. */
      .swatch {
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: 1px solid #00000080;
      }

      .tool-wrap {
        position: relative;
      }

      /* --- Flyout: warianty narzędzia, otwierany przytrzymaniem ------------ */

      #flyout {
        position: absolute;
        left: 56px;
        z-index: 5;
        background: var(--flyout);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        box-shadow: 0 12px 32px #000000a6;
        display: none;
        min-width: 168px;
      }

      #flyout[data-open="true"] {
        display: block;
      }

      .flyout-label {
        color: var(--dim);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 2px 0 6px;
      }

      .flyout-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }

      .flyout-row:last-child {
        margin-bottom: 0;
      }

      .chip {
        border: 1px solid var(--line);
        background: #ffffff08;
        color: var(--ink);
        border-radius: 8px;
        padding: 5px 9px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        background: #4c8dff26;
      }

      .color {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }

      .color[aria-pressed="true"] {
        border-color: var(--ink);
      }

      .size {
        width: 30px;
        height: 26px;
        display: grid;
        place-items: center;
      }

      .size i {
        display: block;
        background: currentColor;
        border-radius: 99px;
      }

      /* --- Kartka: stała szerokość, przewijanie tylko w pionie ------------- */

      #surface {
        flex: 1;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--bg);
      }

      /* Canvas zostaje przyklejony na wierzchu, a #spacer daje pasek przewijania
         o właściwej długości — dzięki temu przewijanie jest natywne, a rysujemy
         tylko to, co widać. */
      #viewport {
        position: sticky;
        top: 0;
        height: 100%;
        z-index: 1;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #spacer {
        width: 1px;
      }

      /* Kursor gumki to okrąg dokładnie w rozmiarze promienia kasowania —
         nigdy generyczny crosshair dla akcji, która ma zasięg. */
      #eraser-cursor {
        position: fixed;
        z-index: 4;
        border: 1.5px solid #ffffffcc;
        border-radius: 50%;
        pointer-events: none;
        display: none;
        mix-blend-mode: difference;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="toolbar">
        <div class="tool-wrap">
          <button class="tool" id="tool-pen" data-tool="pen" aria-pressed="true" title="Pióro — przytrzymaj, żeby zmienić pędzel, kolor i grubość">
            <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" /><path d="M14 6l3 3" /></svg>
          </button>
          <span class="swatch" id="swatch-pen"></span>
        </div>

        <div class="tool-wrap">
          <button class="tool" id="tool-highlighter" data-tool="highlighter" aria-pressed="false" title="Zakreślacz — przytrzymaj, żeby zmienić kolor i grubość">
            <svg viewBox="0 0 24 24"><path d="M7 15l5-9 5 3-5 9H8z" /><path d="M5 21h9" /></svg>
          </button>
          <span class="swatch" id="swatch-highlighter"></span>
        </div>

        <button class="tool" id="tool-eraser" data-tool="eraser" aria-pressed="false" title="Gumka — przytrzymaj, żeby zmienić tryb i rozmiar">
          <svg viewBox="0 0 24 24"><path d="M8 18H5l-2-3 9-9 6 6-6 6z" /><path d="M14 20h6" /></svg>
        </button>

        <div class="rail-gap"></div>

        <button class="tool" id="btn-undo" title="Cofnij" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5" /><path d="M4 12h9a6 6 0 010 12h-1" /></svg>
        </button>

        <button class="tool" id="btn-redo" title="Ponów" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5" /><path d="M20 12h-9a6 6 0 000 12h1" /></svg>
        </button>
      </aside>

      <div id="flyout" role="dialog" aria-label="Warianty narzędzia"></div>

      <div id="surface">
        <div id="viewport"><canvas id="canvas"></canvas></div>
        <div id="spacer"></div>
      </div>
    </div>

    <div id="eraser-cursor"></div>

    <!-- Zvendorowany Yjs + y-webrtc. Budowany przez `npm run vendor`, commitowany do repo. -->
    <script src="renderer/vendor/collab.bundle.js"></script>
    <script src="renderer/core.js"></script>
    <script src="renderer/doc.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
